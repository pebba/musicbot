name: Deploy

on:
  push:
    branches: [main]
  # Auto-merged dependabot PRs are merged with GITHUB_TOKEN, and those pushes
  # deliberately do not trigger workflows — so poll for anything we missed.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: /home/serverboi/musicbot
    steps:
      - name: Pull and install
        id: pull
        run: |
          before=$(git rev-parse HEAD)
          # HTTPS like the runner itself, so a blocked port 22 cannot stall
          # deploys. Separate lines so a failed fetch stops the step under -e
          # instead of falling through to pip with the old requirements.
          git fetch "${{ github.server_url }}/${{ github.repository }}.git" +main:refs/remotes/origin/main
          git reset --hard origin/main
          if [ "$before" = "$(git rev-parse HEAD)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          source venv/bin/activate
          pip install -r requirements.txt -q

      - name: Write .env
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: |
          {
            echo "DISCORD_TOKEN=$DISCORD_TOKEN"
            [ -n "$SPOTIFY_CLIENT_ID" ] && echo "SPOTIFY_CLIENT_ID=$SPOTIFY_CLIENT_ID"
            [ -n "$SPOTIFY_CLIENT_SECRET" ] && echo "SPOTIFY_CLIENT_SECRET=$SPOTIFY_CLIENT_SECRET"
          } > .env

      - name: Write crash alert config
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_DM_USER_ID: ${{ secrets.DISCORD_DM_USER_ID }}
        run: |
          [ -n "$DISCORD_WEBHOOK_URL" ] && echo "$DISCORD_WEBHOOK_URL" > .discord-webhook
          [ -n "$DISCORD_DM_USER_ID" ] && echo "$DISCORD_DM_USER_ID" > .discord-dm-user

      # Don't cut a song off for a deploy: the bot keeps .busy fresh (every 30 s)
      # while anyone is listening, so hold the restart until it is gone. A stale
      # file means the bot is down. Give up after 2 h; manual runs don't wait.
      - name: Wait until nobody is listening
        if: steps.pull.outputs.changed == 'true' && github.event_name != 'workflow_dispatch'
        run: |
          for _ in $(seq 240); do
            [ -f .busy ] || exit 0
            [ $(( $(date +%s) - $(stat -c %Y .busy) )) -gt 120 ] && exit 0
            sleep 30
          done
          echo "Still busy after 2 h, restarting anyway."

      # Skip on an hourly poll that found nothing — no point cutting playback.
      - name: Restart
        if: steps.pull.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: sudo systemctl restart musicbot

      - name: Health check
        run: |
          sleep 5
          systemctl is-active --quiet musicbot || (journalctl -u musicbot -n 30 --no-pager && exit 1)
