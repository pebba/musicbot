version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    # One PR for everything instead of one per transitive pin.
    groups:
      python-deps:
        patterns: ["*"]
    # aiohttp pins multidict<7, so a multidict major makes requirements.txt
    # uninstallable. Drop this once aiohttp allows 7.x.
    ignore:
      - dependency-name: multidict
        update-types: ["version-update:semver-major"]
      # davey 0.2 no longer switches the DAVE key on commit/welcome; discord.py
      # 2.7.1 does not call the new transition API, so the bot plays silence.
      # Drop this once discord.py supports davey 0.2.
      - dependency-name: davey
        versions: [">=0.2"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns: ["*"]
